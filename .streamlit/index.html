<!--
  Custom loading screen for INDMoney Investor Ops & Intelligence Suite.
  Wraps Streamlit's default index.html with a branded shimmer loader overlay
  that auto-dismisses once the React app mounts into #root.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="shortcut icon" href="./favicon.png" />
    <link
      rel="preload"
      href="./static/media/SourceSansVF-Upright.ttf.BsWL4Kly.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>INDMoney — Investor Ops & Intelligence Suite</title>
    <script>window.prerenderReady = false</script>
    <script type="module" crossorigin src="./static/js/index.6xX1278W.js"></script>
    <link rel="stylesheet" crossorigin href="./static/css/index.CIiu7Ygf.css">

    <style>
      /* ── Loading overlay ───────────────────────────────────────────── */
      #ind-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0A0C14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 0.5s ease;
      }
      #ind-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Logo + title block */
      .ind-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .ind-logo {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: cover;
        box-shadow: 0 0 24px rgba(201, 168, 76, 0.3);
      }
      .ind-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: #F5F0E8;
        letter-spacing: 0.01em;
        text-align: center;
        line-height: 1.4;
      }
      .ind-subtitle {
        font-size: 0.78rem;
        font-weight: 500;
        color: #C9A84C;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: -8px;
      }

      /* Shimmer cards */
      .shimmer-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 360px;
      }
      .shimmer-bar {
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          #10131F 25%,
          #1E2235 50%,
          #10131F 75%
        );
        background-size: 400% 100%;
        animation: shimmer 1.6s infinite;
      }
      .shimmer-bar.h20 { height: 20px; width: 100%; }
      .shimmer-bar.h14 { height: 14px; width: 85%; }
      .shimmer-bar.h14.short { width: 60%; }
      .shimmer-bar.h40 { height: 40px; width: 100%; border-radius: 10px; }

      @keyframes shimmer {
        0%   { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }

      /* Loading text */
      .ind-loading-text {
        font-size: 0.78rem;
        color: #5A6080;
        letter-spacing: 0.06em;
        animation: pulse-text 1.6s ease-in-out infinite;
      }
      @keyframes pulse-text {
        0%, 100% { opacity: 0.5; }
        50%       { opacity: 1; }
      }

      /* Gold dot spinner */
      .ind-dots {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .ind-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #C9A84C;
        animation: dot-bounce 1.4s ease-in-out infinite;
      }
      .ind-dot:nth-child(2) { animation-delay: 0.2s; }
      .ind-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40%            { transform: scale(1);   opacity: 1; }
      }
    </style>
  </head>

    <script>
      // Remove the loader once Streamlit's React app has rendered content into #root
      (function () {
        var loader = document.getElementById('ind-loader');
        var root   = document.getElementById('root');

        function dismiss() {
          loader.classList.add('fade-out');
          setTimeout(function () { loader.remove(); }, 600);
        }

        var obs = new MutationObserver(function () {
          if (root.children.length > 0) {
            obs.disconnect();
            // Small delay so Streamlit has time to paint its first frame
            setTimeout(dismiss, 400);
          }
        });
        obs.observe(root, { childList: true, subtree: false });

        // Hard fallback — always remove after 12 s even if detection fails
        setTimeout(dismiss, 12000);
      })();
    </script>
